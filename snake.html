<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇 · 科技版 + 智能AI（激进吃食物版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at 50% 30%, #0f1a3a, #080c1a);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            user-select: none;
        }

        .game-container {
            background: rgba(8, 14, 34, 0.85);
            backdrop-filter: blur(6px);
            padding: 32px 40px 40px;
            border-radius: 28px;
            border: 1px solid rgba(0, 240, 255, 0.20);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 240, 255, 0.06), inset 0 0 60px rgba(0, 240, 255, 0.03);
            transition: box-shadow 0.3s;
        }

        .game-container:hover {
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.9), 0 0 60px rgba(0, 240, 255, 0.10), inset 0 0 60px rgba(0, 240, 255, 0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 18px;
            padding: 0 6px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #00f0ff, #7bdcb5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
        }

        .score-area {
            display: flex;
            align-items: baseline;
            gap: 6px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.70);
            letter-spacing: 0.5px;
        }

        .score-label {
            font-weight: 300;
        }

        .score-value {
            font-size: 28px;
            font-weight: 700;
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
            min-width: 40px;
            text-align: right;
            transition: all 0.15s;
        }

        .canvas-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.30), rgba(123, 220, 181, 0.15));
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        .canvas-wrapper::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            padding: 2px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.40), rgba(123, 220, 181, 0.10));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        #gameCanvas {
            display: block;
            width: 500px;
            height: 500px;
            border-radius: 14px;
            background: #0b1028;
            image-rendering: pixelated;
        }

        .footer {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 32px;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 1.5px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 40px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
            opacity: 0;
            transition: opacity 0.25s;
        }

        .btn:hover::after {
            opacity: 1;
        }
        .btn:active {
            transform: scale(0.96);
        }

        #restartBtn {
            color: #0a0e27;
            background: linear-gradient(135deg, #00f0ff, #00d4a0);
        }
        #restartBtn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 36px rgba(0, 240, 255, 0.35);
        }

        #aiBtn {
            color: #0a0e27;
            background: linear-gradient(135deg, #f0a500, #ff7b2c);
        }
        #aiBtn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 36px rgba(240, 165, 0, 0.35);
        }
        #aiBtn.active {
            background: linear-gradient(135deg, #ff4d6d, #d62828);
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 77, 109, 0.4);
        }
        #aiBtn.active:hover {
            box-shadow: 0 8px 40px rgba(255, 77, 109, 0.5);
        }

        @media (max-width: 580px) {
            .game-container {
                padding: 20px 18px 28px;
                border-radius: 20px;
                width: 96vw;
            }
            #gameCanvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1 / 1;
            }
            .canvas-wrapper {
                padding: 2px;
            }
            .title {
                font-size: 20px;
            }
            .score-value {
                font-size: 22px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 15px;
            }
            .footer {
                gap: 10px;
            }
        }

        @media (max-width: 400px) {
            .game-container {
                padding: 14px 12px 20px;
            }
            .title {
                font-size: 17px;
                gap: 4px;
            }
            .title-icon {
                font-size: 20px;
            }
            .score-area {
                font-size: 14px;
            }
            .score-value {
                font-size: 18px;
                min-width: 30px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="title">
                <span class="title-icon">◈</span>
                贪吃蛇
            </div>
            <div class="score-area">
                <span class="score-label">得分</span>
                <span class="score-value" id="scoreDisplay">0</span>
            </div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="500" height="500"></canvas>
        </div>

        <div class="footer">
            <button id="restartBtn" class="btn">⟳ 重新开始</button>
            <button id="aiBtn" class="btn">🤖 AI自动玩</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  AIController 类 —— 激进吃食物策略
        // ================================================================
        class AIController {

            constructor(game) {
                this.game = game;
                this.GRID_SIZE = game.GRID_SIZE;
                this.lastLog = '';
            }

            /**
             * 对外接口：获取下一个移动方向
             */
            getNextDirection() {
                const snake = this.game.snake;
                const head = snake[snake.length - 1];
                const food = this.game.food;

                if (!food) {
                    this._log('等待食物生成');
                    return null;
                }

                // ----- 1. 优先尝试 BFS 到食物（不再检查安全性） -----
                const dirToFood = this._bfs(head, food);
                if (dirToFood) {
                    this._log('目标：吃食物 | 原因：有路径');
                    return dirToFood;
                } else {
                    this._log('目标：无法到达食物 | 原因：无路径');
                }

                // ----- 2. 尾随策略 (BFS 到蛇尾) -----
                const tail = snake[0];
                if (snake.length > 1) {
                    const dirToTail = this._bfs(head, tail);
                    if (dirToTail && this._isSafeDirection(head, dirToTail.dx, dirToTail.dy)) {
                        this._log('目标：尾随保命 | 原因：跟随蛇尾');
                        return dirToTail;
                    }
                }

                // ----- 3. 保持当前方向（如果安全） -----
                const curDir = this.game.direction;
                if (this._isSafeDirection(head, curDir.dx, curDir.dy)) {
                    this._log('目标：保持方向 | 原因：安全');
                    return { dx: curDir.dx, dy: curDir.dy };
                }

                // ----- 4. 备选方向（上→下→左→右，允许反向） -----
                const fallback = this._getFallback(head);
                if (fallback) {
                    this._log('目标：紧急避让 | 原因：无其他安全方向');
                    return fallback;
                }

                // ----- 5. 最后保底：任意方向 -----
                const anyDir = this._getAnyDirection(head);
                if (anyDir) {
                    this._log('目标：最后一搏 | 原因：所有方向均不安全');
                    return anyDir;
                }

                this._log('目标：无路可走');
                return null;
            }

            /**
             * BFS 搜索从 start 到 target 的第一步方向
             */
            _bfs(start, target) {
                const gridSize = this.GRID_SIZE;
                const snake = this.game.snake;
                const snakeSet = new Set(snake.map(s => `${s.x},${s.y}`));
                const tail = snake[0];
                const tailKey = `${tail.x},${tail.y}`;

                if (start.x === target.x && start.y === target.y) return null;

                const visited = new Set();
                const queue = [];
                visited.add(`${start.x},${start.y}`);
                queue.push({ x: start.x, y: start.y, dx: 0, dy: 0 });

                const dirs = [
                    { dx: 0, dy: -1 }, // 上
                    { dx: 0, dy: 1 },  // 下
                    { dx: -1, dy: 0 }, // 左
                    { dx: 1, dy: 0 }   // 右
                ];

                while (queue.length > 0) {
                    const cur = queue.shift();
                    if (cur.x === target.x && cur.y === target.y) {
                        if (cur.dx === 0 && cur.dy === 0) return null;
                        return { dx: cur.dx, dy: cur.dy };
                    }
                    for (const d of dirs) {
                        const nx = cur.x + d.dx;
                        const ny = cur.y + d.dy;
                        const key = `${nx},${ny}`;
                        if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) continue;
                        if (visited.has(key)) continue;
                        if (snakeSet.has(key) && key !== tailKey) continue;

                        visited.add(key);
                        const firstDx = (cur.dx === 0 && cur.dy === 0) ? d.dx : cur.dx;
                        const firstDy = (cur.dx === 0 && cur.dy === 0) ? d.dy : cur.dy;
                        queue.push({ x: nx, y: ny, dx: firstDx, dy: firstDy });
                    }
                }
                return null;
            }

            /**
             * 检查某个方向是否安全（不撞墙、不撞自身，蛇尾视为可通行）
             */
            _isSafeDirection(head, dx, dy) {
                const gridSize = this.GRID_SIZE;
                const snake = this.game.snake;
                const snakeSet = new Set(snake.map(s => `${s.x},${s.y}`));
                const tail = snake[0];
                const tailKey = `${tail.x},${tail.y}`;

                const nx = head.x + dx;
                const ny = head.y + dy;
                const key = `${nx},${ny}`;
                if (nx < 0 || nx >= gridSize || ny < 0 || ny >= gridSize) return false;
                if (snakeSet.has(key) && key !== tailKey) return false;
                return true;
            }

            /**
             * 备选方向：按优先级上→下→左→右（允许反向）
             */
            _getFallback(head) {
                const dirs = [
                    { dx: 0, dy: -1 }, // 上
                    { dx: 0, dy: 1 },  // 下
                    { dx: -1, dy: 0 }, // 左
                    { dx: 1, dy: 0 }   // 右
                ];
                for (const d of dirs) {
                    if (this._isSafeDirection(head, d.dx, d.dy)) {
                        return { dx: d.dx, dy: d.dy };
                    }
                }
                return null;
            }

            /**
             * 保底：任意安全方向
             */
            _getAnyDirection(head) {
                const dirs = [
                    { dx: 0, dy: -1 }, { dx: 0, dy: 1 },
                    { dx: -1, dy: 0 }, { dx: 1, dy: 0 }
                ];
                for (const d of dirs) {
                    if (this._isSafeDirection(head, d.dx, d.dy)) {
                        return { dx: d.dx, dy: d.dy };
                    }
                }
                return null;
            }

            /**
             * 智能日志：仅在消息变化时输出
             */
            _log(msg) {
                if (this.lastLog !== msg) {
                    console.log(`[AI] ${msg}`);
                    this.lastLog = msg;
                }
            }

            /**
             * 执行一步 AI 决策
             */
            step() {
                if (this.game.gameOver) return;
                const dir = this.getNextDirection();
                if (dir) {
                    this.game.forceDirection(dir.dx, dir.dy);
                }
            }
        }


        // ================================================================
        //  Game 类
        // ================================================================
        class Game {

            constructor(canvasId, scoreId, restartBtnId, aiBtnId) {
                this.canvas = document.getElementById(canvasId);
                this.ctx = this.canvas.getContext('2d');
                this.scoreSpan = document.getElementById(scoreId);
                this.restartBtn = document.getElementById(restartBtnId);
                this.aiBtn = document.getElementById(aiBtnId);

                this.GRID_SIZE = 20;
                this.CELL_SIZE = 25;
                this.canvas.width = this.GRID_SIZE * this.CELL_SIZE;
                this.canvas.height = this.GRID_SIZE * this.CELL_SIZE;

                this.snake = [];
                this.direction = { dx: 1, dy: 0 };
                this.nextDirection = { dx: 1, dy: 0 };
                this.food = null;
                this.score = 0;
                this.gameOver = false;
                this.isRunning = false;

                this.aiActive = false;
                this.aiController = new AIController(this);
                this.aiTimer = null;
                this.AI_INTERVAL = 200;

                this.loopTimer = null;
                this.INTERVAL_MS = 145;

                this._bindEvents();
                this.reset();
            }

            forceDirection(dx, dy) {
                this.nextDirection = { dx, dy };
            }

            toggleAI() {
                if (this.gameOver) {
                    alert('游戏已结束，请先点击「重新开始」');
                    return;
                }
                this.aiActive = !this.aiActive;
                if (this.aiActive) {
                    this._startAI();
                    this.aiBtn.textContent = '⏹ 停止AI';
                    this.aiBtn.classList.add('active');
                } else {
                    this._stopAI();
                    this.aiBtn.textContent = '🤖 AI自动玩';
                    this.aiBtn.classList.remove('active');
                }
            }

            _startAI() {
                if (this.aiTimer) return;
                this.aiController.step();
                this.aiTimer = setInterval(() => {
                    if (!this.gameOver && this.aiActive) {
                        this.aiController.step();
                    } else {
                        if (this.gameOver) {
                            this._stopAI();
                            this.aiBtn.textContent = '🤖 AI自动玩';
                            this.aiBtn.classList.remove('active');
                            this.aiActive = false;
                        }
                    }
                }, this.AI_INTERVAL);
            }

            _stopAI() {
                if (this.aiTimer) {
                    clearInterval(this.aiTimer);
                    this.aiTimer = null;
                }
                this.aiActive = false;
                this.aiBtn.textContent = '🤖 AI自动玩';
                this.aiBtn.classList.remove('active');
            }

            reset() {
                this._stopAI();
                this._stopLoop();

                this.gameOver = false;
                this.isRunning = false;
                this.score = 0;
                this.direction = { dx: 1, dy: 0 };
                this.nextDirection = { dx: 1, dy: 0 };

                this.snake = [
                    { x: 8, y: 10 },
                    { x: 9, y: 10 },
                    { x: 10, y: 10 }
                ];

                this._generateFood();
                this._updateScore();
                this.draw();
                this._startLoop();
            }

            _startLoop() {
                if (this.loopTimer) return;
                this.isRunning = true;
                this.loopTimer = setInterval(() => {
                    if (!this.gameOver && this.isRunning) {
                        this._update();
                        this.draw();
                    }
                }, this.INTERVAL_MS);
            }

            _stopLoop() {
                if (this.loopTimer) {
                    clearInterval(this.loopTimer);
                    this.loopTimer = null;
                }
                this.isRunning = false;
            }

            // ---------- 核心更新：AI 激活时强制应用方向 ----------
            _update() {
                // 如果 AI 激活，直接使用 nextDirection（不检查反向）
                if (this.aiActive) {
                    this.direction = { ...this.nextDirection };
                } else {
                    // 手动模式：防止反向
                    if (!this._isOpposite(this.nextDirection, this.direction)) {
                        this.direction = { ...this.nextDirection };
                    }
                }

                const head = this.snake[this.snake.length - 1];
                const newHead = {
                    x: head.x + this.direction.dx,
                    y: head.y + this.direction.dy
                };

                const ateFood = (this.food && newHead.x === this.food.x && newHead.y === this.food.y);

                this.snake.push(newHead);
                if (!ateFood) {
                    this.snake.shift();
                } else {
                    this.score += 1;
                    this._updateScore();
                    this._generateFood();
                    if (!this.food) {
                        this._generateFood();
                    }
                }

                if (this._checkCollision()) {
                    this._gameOver();
                }
            }

            draw() {
                const ctx = this.ctx;
                const W = this.canvas.width;
                const H = this.canvas.height;
                const cell = this.CELL_SIZE;
                const grid = this.GRID_SIZE;

                ctx.fillStyle = '#0b1028';
                ctx.fillRect(0, 0, W, H);

                ctx.strokeStyle = 'rgba(0, 240, 255, 0.07)';
                ctx.lineWidth = 0.8;
                for (let i = 0; i <= grid; i++) {
                    const pos = i * cell;
                    ctx.beginPath();
                    ctx.moveTo(pos, 0);
                    ctx.lineTo(pos, H);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, pos);
                    ctx.lineTo(W, pos);
                    ctx.stroke();
                }

                ctx.fillStyle = 'rgba(0, 240, 255, 0.10)';
                for (let i = 0; i <= grid; i++) {
                    for (let j = 0; j <= grid; j++) {
                        ctx.beginPath();
                        ctx.arc(i * cell, j * cell, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (this.food) {
                    const fx = this.food.x * cell + cell / 2;
                    const fy = this.food.y * cell + cell / 2;
                    const radius = cell * 0.40;
                    const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, radius * 2.4);
                    glow.addColorStop(0, 'rgba(255, 80, 120, 0.45)');
                    glow.addColorStop(1, 'rgba(255, 80, 120, 0)');
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(fx, fy, radius * 2.4, 0, Math.PI * 2);
                    ctx.fill();

                    const grad = ctx.createRadialGradient(fx - 3, fy - 3, 1, fx, fy, radius);
                    grad.addColorStop(0, '#ff7b9c');
                    grad.addColorStop(0.7, '#ff3366');
                    grad.addColorStop(1, '#cc1144');
                    ctx.shadowColor = '#ff3366';
                    ctx.shadowBlur = 18;
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(fx, fy, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.30)';
                    ctx.beginPath();
                    ctx.arc(fx - 3, fy - 4, radius * 0.25, 0, Math.PI * 2);
                    ctx.fill();
                }

                const len = this.snake.length;
                for (let i = 0; i < len; i++) {
                    const seg = this.snake[i];
                    const sx = seg.x * cell;
                    const sy = seg.y * cell;
                    const isHead = (i === len - 1);
                    const t = len > 1 ? i / (len - 1) : 0.5;
                    const r = Math.round(0 + t * 20);
                    const g = Math.round(180 + t * 75);
                    const b = Math.round(255 - t * 60);
                    const color = `rgb(${r}, ${g}, ${b})`;
                    const padding = 1.5;
                    const radius = 4;
                    const x = sx + padding;
                    const y = sy + padding;
                    const w = cell - padding * 2;
                    const h = cell - padding * 2;

                    ctx.shadowColor = `rgba(0, 240, 255, ${isHead ? 0.50 : 0.20})`;
                    ctx.shadowBlur = isHead ? 20 : 8;

                    if (isHead) {
                        const headGrad = ctx.createRadialGradient(
                            sx + cell / 2 - 2, sy + cell / 2 - 2, 2,
                            sx + cell / 2, sy + cell / 2, cell / 2
                        );
                        headGrad.addColorStop(0, '#88ffdd');
                        headGrad.addColorStop(0.6, '#00f0ff');
                        headGrad.addColorStop(1, '#0099bb');
                        ctx.fillStyle = headGrad;
                    } else {
                        ctx.fillStyle = color;
                    }

                    ctx.beginPath();
                    ctx.moveTo(x + radius, y);
                    ctx.lineTo(x + w - radius, y);
                    ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                    ctx.lineTo(x + w, y + h - radius);
                    ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                    ctx.lineTo(x + radius, y + h);
                    ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                    ctx.lineTo(x, y + radius);
                    ctx.quadraticCurveTo(x, y, x + radius, y);
                    ctx.closePath();
                    ctx.fill();

                    if (isHead) {
                        ctx.shadowBlur = 0;
                        const eyeSize = 3.5;
                        let ex1, ey1, ex2, ey2;
                        const dir = this.direction;
                        if (dir.dx === 1) {
                            ex1 = sx + cell - 7;
                            ey1 = sy + 6;
                            ex2 = sx + cell - 7;
                            ey2 = sy + cell - 6;
                        } else if (dir.dx === -1) {
                            ex1 = sx + 7;
                            ey1 = sy + 6;
                            ex2 = sx + 7;
                            ey2 = sy + cell - 6;
                        } else if (dir.dy === -1) {
                            ex1 = sx + 6;
                            ey1 = sy + 7;
                            ex2 = sx + cell - 6;
                            ey2 = sy + 7;
                        } else {
                            ex1 = sx + 6;
                            ey1 = sy + cell - 7;
                            ex2 = sx + cell - 6;
                            ey2 = sy + cell - 7;
                        }
                        ctx.fillStyle = 'rgba(10, 14, 39, 0.85)';
                        ctx.beginPath();
                        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(ex1 - 1, ey1 - 1.5, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex2 - 1, ey2 - 1.5, 1.6, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.shadowBlur = 0;
                }

                if (this.gameOver) {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.40)';
                    ctx.fillRect(0, 0, W, H);
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = '#ff3366';
                    ctx.shadowBlur = 40;
                    ctx.font = 'bold 44px "Segoe UI", "PingFang SC", sans-serif';
                    ctx.fillStyle = '#ff3366';
                    ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
                    ctx.shadowBlur = 0;
                    ctx.font = '18px "Segoe UI", "PingFang SC", sans-serif';
                    ctx.fillStyle = 'rgba(255,255,255,0.60)';
                    ctx.fillText('点击「重新开始」', W / 2, H / 2 + 48);
                }
            }

            _generateFood() {
                const maxAttempts = 1000;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const fx = Math.floor(Math.random() * this.GRID_SIZE);
                    const fy = Math.floor(Math.random() * this.GRID_SIZE);
                    if (!this._isOnSnake(fx, fy)) {
                        this.food = { x: fx, y: fy };
                        return;
                    }
                }
                for (let y = 0; y < this.GRID_SIZE; y++) {
                    for (let x = 0; x < this.GRID_SIZE; x++) {
                        if (!this._isOnSnake(x, y)) {
                            this.food = { x, y };
                            return;
                        }
                    }
                }
                this.food = null;
            }

            _isOnSnake(x, y) {
                return this.snake.some(seg => seg.x === x && seg.y === y);
            }

            _checkCollision() {
                const head = this.snake[this.snake.length - 1];
                if (head.x < 0 || head.x >= this.GRID_SIZE || head.y < 0 || head.y >= this.GRID_SIZE) {
                    return true;
                }
                for (let i = 0; i < this.snake.length - 1; i++) {
                    if (this.snake[i].x === head.x && this.snake[i].y === head.y) {
                        return true;
                    }
                }
                return false;
            }

            _gameOver() {
                if (this.gameOver) return;
                this.gameOver = true;
                this.isRunning = false;
                this._stopLoop();
                if (this.aiActive) {
                    this._stopAI();
                }
                this.draw();
                setTimeout(() => {
                    alert(`💀 游戏结束！\n\n最终得分：${this.score}`);
                }, 60);
            }

            _updateScore() {
                this.scoreSpan.textContent = this.score;
                this.scoreSpan.style.transform = 'scale(1.25)';
                setTimeout(() => {
                    this.scoreSpan.style.transform = 'scale(1)';
                }, 120);
            }

            _isOpposite(dir1, dir2) {
                return (dir1.dx === -dir2.dx && dir1.dy === -dir2.dy);
            }

            _bindEvents() {
                document.addEventListener('keydown', (e) => {
                    const key = e.key;
                    if (key.startsWith('Arrow')) {
                        e.preventDefault();
                    }
                    if (this.gameOver) return;
                    if (this.aiActive) return;

                    let newDx = 0,
                        newDy = 0;
                    switch (key) {
                        case 'ArrowUp':
                            newDy = -1;
                            break;
                        case 'ArrowDown':
                            newDy = 1;
                            break;
                        case 'ArrowLeft':
                            newDx = -1;
                            break;
                        case 'ArrowRight':
                            newDx = 1;
                            break;
                        default:
                            return;
                    }
                    const candidate = { dx: newDx, dy: newDy };
                    if (!this._isOpposite(candidate, this.direction)) {
                        this.nextDirection = candidate;
                    }
                });

                this.restartBtn.addEventListener('click', () => {
                    this.reset();
                });

                this.aiBtn.addEventListener('click', () => {
                    this.toggleAI();
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key.startsWith('Arrow')) {
                        e.preventDefault();
                    }
                }, { passive: false });
            }
        }

        // ================================================================
        //  启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', () => {
            const game = new Game('gameCanvas', 'scoreDisplay', 'restartBtn', 'aiBtn');
            window.__game = game;
        });
    </script>

</body>
